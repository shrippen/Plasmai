# PR-Agent settings for Plasmai (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# Claude Opus 4.7+ and Claude 5 take no temperature, only adaptive thinking
# with an effort (Opus 5.5 defaults to medium); the effort applies to other
# reasoning models too.
enable_claude_adaptive_thinking = true
reasoning_effort = "high"
# The repository rules and the review guide go along as context.
repo_context_files = ["agent.md", "REVIEW.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of Plasmai, a KDE Plasma 6 panel widget and app
(QML, C++) for time tracking with Kimai, Clockify, Toggl Track or
SolidTime.
The PRs are written by an AI agent; review them as a careful second
reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Providers: one provider's API behaviour assumed for the others;
  a running timer lost or doubled (stop/start, offline, sleep).
- API tokens outside the keychain or in logs; demo code in the widget
  package or the app.
- Kante copies (contents/ui/Kante*) edited instead of synced; `var`
  turned into `let` although the variable is read after the block.
- Missing tests for new behaviour.
- Breaches of the repository rules (agent.md).

Label each finding **Wichtig**, **Kleinigkeit** or **Bestand** as REVIEW.md
defines them, at the start of its title.

Skip style, naming and formatting (qmllint and the tests run separately), praise, and
guesses you cannot back with the diff. When you find nothing that
matters, say so in one line.
"""
