# Draft F-Droid recipe for the Plasmai Android app (app/, package com.github.shrippen.plasmai;
# the Plasma widget is a separate distribution, see RELEASING.md 4 vs 5). Not the Flathub/AppImage
# builds — this is for F-Droid's own build server, and follows the pattern of existing KF6/Qt
# recipes already in fdroiddata (checked metadata/org.kde.ktrip.yml, de.asmw.sudokunst.yml,
# de.akaflieg_freiburg.enroute.yml before writing this): the build: phase clones and builds Qt/KF6
# from source itself, same as it would in CI — there is no offline/no-network restriction on it,
# unlike an earlier draft of this file assumed. So this is now a close, explicit translation of
# scripts/build-kf6-android.sh + scripts/build-android.sh, not a rewrite around srclibs.
#
# This file keeps comments for maintenance; the version actually submitted (pushed to the
# shrippen/fdroiddata fork, branch new/com.github.shrippen.plasmai) has none, because
# `fdroid rewritemeta` — which fdroiddata's CI checks the file against — strips all comments and
# reflows lines its own way. After editing this file, copy it into the fdroiddata clone, run
# `fdroid rewritemeta com.github.shrippen.plasmai` there, and commit *that* output.
#
# TESTED against a real GitLab CI pipeline (MR !1 in shrippen/fdroiddata's own fork, opened
# against its own master purely to trigger a merge_request_event pipeline — not the upstream
# submission). Two real bugs this caught and fixed:
#   - `fdroid rewritemeta` job: requires AutoUpdateMode/UpdateCheckMode/UpdateCheckData/
#     CurrentVersion/CurrentVersionCode (schema-required, added) and unquoted version strings.
#   - `fdroid build` job, twice: first, `--licenses` piped into the same command as installing
#     the NDK — split into its own step first, matching fdroiddata's own recipes
#     (de.wger.flutter.yml, com.gnethomelinux.midistrum.yml). Second, even split out, the step
#     still failed the whole `sudo:` script *despite* sdkmanager printing "All SDK package
#     licenses accepted": `yes` gets SIGPIPE once sdkmanager stops reading, and `set -o
#     pipefail` (confirmed in the job's own `bash -e -u -o pipefail` invocation) turns that into
#     the pipeline's exit status. Fixed with `|| true` on that one line — a genuine sdkmanager
#     failure still surfaces at the next (non-yes-piped) sdkmanager call, which needs the
#     licenses already accepted to succeed.
#   - Canonicalizing with any local fdroidserver (git `master` included) never matched CI's own
#     wrap points exactly — CI actually installs it via `apt-get install fdroidserver` (Debian
#     trixie's package, with Debian's own `ruamel.yaml` version), not from PyPI or a git clone,
#     and ruamel's exact wrap points are version-sensitive. Stop chasing byte-for-byte parity
#     with a local run; instead take the diff `fdroid rewritemeta` prints in the CI job's own
#     log as the correction to apply, and verify only that a *second* local rewritemeta pass
#     changes nothing further (idempotent), which is a much weaker but sufficient check.
#   - F-Droid's scanner rejected the checked-in prebuilt OpenSSL .so files (see `scandelete:`
#     and the OpenSSL build steps below) — it runs right after checkout, before `sudo:`/`build:`,
#     so this only became visible once the earlier `sudo:` license failures were fixed and the
#     job got far enough to reach it.
# Verification is now blocked on how far a real pipeline gets past this point, not on further
# static checks — re-run the CI (open the MR in shrippen/fdroiddata against its own master) and
# read the `fdroid build` job's log for the next real error. Checked so far, still valid:
#   - Every individual cmake/gradle command below is one scripts/build-android.sh and
#     scripts/build-kf6-android.sh already run successfully (verified in this project's own CI).
#   - Against the MR template (.gitlab/merge_request_templates/App inclusion.md): no
#     Description/summary here (the upstream repo's fastlane/metadata/android/ has it, which is
#     what that template asks for instead), and `commit:` is the full hash, not a tag.
# Before opening the real PR, re-check:
#   - Whether the androiddeployqt-generated Gradle project's dependencies (Android Gradle Plugin,
#     AndroidX, Kotlin stdlib) resolve on F-Droid's builder without extra `sudo:` seeding — other
#     Gradle-based recipes there just run `./gradlew assembleRelease` successfully, so this is
#     likely fine, but this exact Qt6+KF6+Gradle combination is untested.
#   - `Builds[0].commit`/`versionName`/`versionCode` for whatever tag is actually submitted
#     (this draft targets v2.0.0, commit f6f9f060b11b08960854922bc898a347eb2facb1).
#   - The NDK version (28.2.13676358) and Qt version (6.7.3) against whatever is current when
#     you submit.
#   - Not yet done, per the template: Reproducible Builds is not enabled (would use your own
#     signature instead of F-Droid's); the "external repos as git submodules instead of srclibs"
#     checklist item isn't addressed either — the KF6 sources are cloned directly in `build:`
#     below rather than vendored as submodules of the Plasmai repo. Both are worth doing before
#     or during review, not blockers to opening the MR.

Categories:
  - Time Tracker
License: GPL-3.0-or-later
AuthorName: shrippen
WebSite: https://github.com/shrippen/Plasmai
SourceCode: https://github.com/shrippen/Plasmai
IssueTracker: https://github.com/shrippen/Plasmai/issues
Changelog: https://github.com/shrippen/Plasmai/blob/HEAD/CHANGELOG.md

AutoName: Plasmai

RepoType: git
Repo: https://github.com/shrippen/Plasmai.git

Builds:
  - versionName: '2.0.0'
    versionCode: 20000
    commit: f6f9f060b11b08960854922bc898a347eb2facb1
    timeout: 10800

    # Root, network available. sdkmanager is already on PATH and $$SDK$$ pre-populated by the
    # buildserver's own base image (confirmed in a real test run: no need to bootstrap
    # cmdline-tools ourselves, unlike scripts/build-android.sh's from-scratch environment) — just
    # aqtinstall (Qt6 host + android_arm64_v8a) and the exact Android NDK version we pin.
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake ninja-build python3-pip perl make g++
        libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - pip install --break-system-packages aqtinstall
      - aqt install-qt linux android 6.7.3 android_arm64_v8a -m qtshadertools -O /opt/plasmai-qt
      - aqt install-qt linux desktop 6.7.3 linux_gcc_64 -m qtshadertools -O /opt/plasmai-qt
      # sdkmanager exits 0 here (see the "All SDK package licenses accepted" line), but `yes`
      # gets SIGPIPE once it stops reading, and pipefail turns that into this line's exit status
      # — `|| true` tolerates it; a genuine failure still surfaces at the next sdkmanager call.
      - yes | sdkmanager --licenses || true
      - sdkmanager "ndk;28.2.13676358"

    # Building OpenSSL from source: the checked-in app/libs/openssl/arm64-v8a/*.so (prebuilt,
    # from KDAB/android_openssl, bundled for Qt Network's TLS backend — app/CMakeLists.txt) are
    # exactly the kind of prebuilt binary F-Droid's scanner rejects (hit in a real test run:
    # "Found shared library at app/libs/openssl/..."). scandelete: (below) removes them from the
    # scanned source; this replaces them with the same files, built from source, before the app
    # itself is configured, so Qt Network's HTTPS support (all backends are HTTPS APIs) still
    # works. SHLIB_VERSION_NUMBER=/SHLIB_EXT= matches the KDAB naming CMakeLists.txt expects
    # (libssl_3.so, not the default libssl.so.3), same idea as other recipes' OpenSSL builds
    # (org.kde.ktrip.yml, de.akaflieg_freiburg.enroute.yml) with different override values.
    #
    # Unprivileged: the same three cmake passes as scripts/build-kf6-android.sh (ECM,
    # KCoreAddons, Kirigami, cross-compiled), then the app itself as scripts/build-android.sh does.
    build:
      - export NDK_PATH=$$SDK$$/ndk/28.2.13676358
      - export QT_ANDROID=/opt/plasmai-qt/6.7.3/android_arm64_v8a
      - export QT_HOST=/opt/plasmai-qt/6.7.3/gcc_64
      - export KF6=$HOME/kf6-android
      - mkdir -p $KF6
      - git clone --quiet --depth 1 --branch openssl-3.3.2
        https://github.com/openssl/openssl.git /tmp/openssl
      - cd /tmp/openssl
      - export ANDROID_NDK_ROOT=$NDK_PATH
      - PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH ./Configure shared
        android-arm64 -D__ANDROID_API__=28
      - PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH make -j$(nproc)
        SHLIB_VERSION_NUMBER= SHLIB_EXT=_3.so build_libs > /tmp/openssl-build.log 2>&1 ||
        (tail -n 200 /tmp/openssl-build.log; exit 1)
      - cd -
      - mkdir -p app/libs/openssl/arm64-v8a
      - ls -la /tmp/openssl/*.so* 2>&1 || true
      - for f in libssl libcrypto; do src=$(ls /tmp/openssl/${f}*.so* 2>/dev/null | head -1);
        if [ -n "$src" ]; then cp "$src" app/libs/openssl/arm64-v8a/${f}_3.so; fi; done
      - ls -la app/libs/openssl/arm64-v8a/
      - git clone --quiet --depth 1 --branch v6.8.0
        https://invent.kde.org/frameworks/extra-cmake-modules.git /tmp/ecm
      - cmake -S /tmp/ecm -B /tmp/ecm/build -G Ninja -DCMAKE_INSTALL_PREFIX=$KF6
        -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF
        -DBUILD_MAN_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF
      - cmake --build /tmp/ecm/build -j$(nproc)
      - cmake --install /tmp/ecm/build
      - git clone --quiet --depth 1 --branch v6.8.0
        https://invent.kde.org/frameworks/kcoreaddons.git /tmp/kcoreaddons
      - cmake -S /tmp/kcoreaddons -B /tmp/kcoreaddons/build -G Ninja
        -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PREFIX_PATH="$QT_ANDROID;$KF6" -DCMAKE_INSTALL_PREFIX=$KF6
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DQT_HOST_PATH=$QT_HOST
        -DECM_DIR=$KF6/share/ECM/cmake -DBUILD_TESTING=OFF -DBUILD_QCH=OFF
      - cmake --build /tmp/kcoreaddons/build -j$(nproc)
      - cmake --install /tmp/kcoreaddons/build
      - git clone --quiet --depth 1 --branch v6.8.0
        https://invent.kde.org/frameworks/kirigami.git /tmp/kirigami
      - cmake -S /tmp/kirigami -B /tmp/kirigami/build -G Ninja
        -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PREFIX_PATH="$QT_ANDROID;$KF6" -DCMAKE_INSTALL_PREFIX=$KF6
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DQT_HOST_PATH=$QT_HOST
        -DECM_DIR=$KF6/share/ECM/cmake -DBUILD_TESTING=OFF -DBUILD_QCH=OFF
        -DBUILD_EXAMPLES=OFF -DDESKTOP_ENABLED=OFF
      - cmake --build /tmp/kirigami/build -j$(nproc)
      - cmake --install /tmp/kirigami/build
      - cd app
      - cmake -B build-android
        -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake
        -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34
        -DCMAKE_PREFIX_PATH="$QT_ANDROID;$KF6" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
        -DQT_HOST_PATH=$QT_HOST -DANDROID_SDK_ROOT=$$SDK$$
        -DQT_ANDROID_TARGET_SDK_VERSION=34 -DECM_DIR=$KF6/share/ECM/cmake
        -DQT_QML_IMPORT_PATH=$KF6/lib/qml -DBUILD_TESTING=OFF
      - cmake --build build-android -j$(nproc)
      - export LIBOMP=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/19/lib/linux/aarch64/libomp.so
      - mkdir -p build-android/android-build/libs/arm64-v8a
      - test -f $LIBOMP && cp $LIBOMP build-android/android-build/libs/arm64-v8a/ || true
      - cd build-android/android-build
      - ./gradlew assembleRelease

    output: app/build-android/android-build/build/outputs/apk/release/android-build-release-unsigned.apk
    scandelete:
      - app/libs/openssl/arm64-v8a/libssl_3.so
      - app/libs/openssl/arm64-v8a/libcrypto_3.so

# Auto-update from new git tags (CONTRIBUTING.md "After You Added Your App"). versionCode isn't
# derivable from the tag name alone (v2.0.0 -> 20000), so UpdateCheckData reads it from
# AndroidManifest.xml, which RELEASING.md 1's version bump keeps in sync with metadata.json.
AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/android/AndroidManifest.xml|versionCode="(\d+)"|.|versionName="([\d.]+)"
CurrentVersion: '2.0.0'
CurrentVersionCode: 20000
