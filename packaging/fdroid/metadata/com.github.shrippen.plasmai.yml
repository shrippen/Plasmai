# F-Droid recipe for the Plasmai Android app (app/, package com.github.shrippen.plasmai; the
# Plasma widget is a separate distribution, see RELEASING.md 4 vs 5). BUILD-VERIFIED: this exact
# content produced a working, signed-by-F-Droid-test-keys APK in a real GitLab CI pipeline (a
# merge_request_event pipeline against shrippen/fdroiddata's own fork, opened purely to trigger
# CI — not a submission — then closed once green: `fdroid build`, `check apk`, `fdroid
# rewritemeta`, `fdroid lint`, schema validation, `checkupdates` all passed). It got there through
# many small real bugs (missing sdkmanager licenses/pipefail interaction, a scanner rejection of
# vendored OpenSSL binaries, several missing apt packages, OpenSSL's actual output filenames
# differing from the KDAB-style names assumed, a missing android-34 platform) — see the git
# history of this file for what each one was and how it was found and fixed, rather than
# repeating it all here.
#
# This file keeps comments for maintenance; the version actually pushed (shrippen/fdroiddata
# fork, branch new/com.github.shrippen.plasmai) has none, because `fdroid rewritemeta` — which
# fdroiddata's CI checks the file against — strips all comments and reflows lines its own way
# (and its exact wrap points only match Debian trixie's apt-installed fdroidserver/ruamel.yaml,
# not any local pip or git-master install — verify idempotency locally, but take the CI job's own
# diff as the correction for wrap points, not a local rewritemeta run). After editing this file:
#   1. Copy it into the fdroiddata clone's metadata/, run
#      `fdroid rewritemeta com.github.shrippen.plasmai` there.
#   2. Diff against git HEAD; if the two lines noted below reappear unwrapped, that's expected
#      (local rewritemeta disagrees with CI on exactly these two spots) — re-apply by hand:
#        - `output: <path>` -> `output: \n      <path>` (trailing space after the colon)
#        - `- export LIBOMP=<path>` -> `- export \n        LIBOMP=<path>` (same trailing space)
#   3. `check-jsonschema --schemafile schemas/metadata.json metadata/com.github.shrippen.plasmai.yml`
#      and `fdroid lint com.github.shrippen.plasmai` should both pass clean.
#   4. Commit and push to the fork; if you want to re-verify before the real submission, open a
#      throwaway MR against the fork's own master (triggers a merge_request_event pipeline) and
#      close it once done, as above.
#
# Before opening the real PR to F-Droid/fdroiddata, still worth doing (not blockers, per the MR
# template .gitlab/merge_request_templates/App inclusion.md):
#   - Enable Reproducible Builds. TESTED, doesn't reproduce yet: `fdroid signatures` against the
#     real signed v2.0.0 GitHub release APK, committed, then the from-source build failed at the
#     implant step with "APK Signing Block offset < central directory offset" — a real byte-level
#     size mismatch (build paths in .so debug info, toolchain versions, timestamps likely differ
#     between GitHub Actions and F-Droid's buildserver), not just a missing setup step. This is a
#     one-way door once a release is actually published with F-Droid's key, so don't enable it
#     without re-testing — revisit once both build pipelines are normalized
#     (`-ffile-prefix-map`, matching JDK/AGP/gradle-wrapper versions) for a later release.
#   - Vendor the KF6 sources as git submodules of the Plasmai repo instead of a plain `git clone`
#     inside `build:` (the template's "external repos as git submodules instead of srclibs").
#   - Bump `Builds[0].commit`/`versionName`/`versionCode` for whatever tag is actually submitted
#     (this targets v2.0.0, commit f6f9f060b11b08960854922bc898a347eb2facb1) and recheck the NDK
#     (28.2.13676358) and Qt (6.7.3) versions against whatever is current then.


Categories:
  - Time Tracker
License: GPL-3.0-or-later
AuthorName: shrippen
WebSite: https://github.com/shrippen/Plasmai
SourceCode: https://github.com/shrippen/Plasmai
IssueTracker: https://github.com/shrippen/Plasmai/issues
Changelog: https://github.com/shrippen/Plasmai/blob/HEAD/CHANGELOG.md

AutoName: Plasmai

RepoType: git
Repo: https://github.com/shrippen/Plasmai.git

Builds:
  - versionName: '2.0.0'
    versionCode: 20000
    commit: f6f9f060b11b08960854922bc898a347eb2facb1
    timeout: 10800

    # Root, network available. sdkmanager is already on PATH and $$SDK$$ pre-populated by the
    # buildserver's own base image (confirmed in a real test run: no need to bootstrap
    # cmdline-tools ourselves, unlike scripts/build-android.sh's from-scratch environment) — just
    # aqtinstall (Qt6 host + android_arm64_v8a) and the exact Android NDK version we pin.
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake ninja-build python3-pip perl make g++
        libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - pip install --break-system-packages aqtinstall
      - aqt install-qt linux android 6.7.3 android_arm64_v8a -m qtshadertools -O /opt/plasmai-qt
      - aqt install-qt linux desktop 6.7.3 linux_gcc_64 -m qtshadertools -O /opt/plasmai-qt
      # sdkmanager exits 0 here (see the "All SDK package licenses accepted" line), but `yes`
      # gets SIGPIPE once it stops reading, and pipefail turns that into this line's exit status
      # — `|| true` tolerates it; a genuine failure still surfaces at the next sdkmanager call.
      - yes | sdkmanager --licenses || true
      - sdkmanager "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0"

    # Building OpenSSL from source: the checked-in app/libs/openssl/arm64-v8a/*.so (prebuilt,
    # from KDAB/android_openssl, bundled for Qt Network's TLS backend — app/CMakeLists.txt) are
    # exactly the kind of prebuilt binary F-Droid's scanner rejects ("Found shared library at
    # app/libs/openssl/..."). scandelete: (below) removes them from the scanned source; this
    # replaces them with the same files, built from source, before the app itself is configured,
    # so Qt Network's HTTPS support (all backends are HTTPS APIs) still works.
    # SHLIB_VERSION_NUMBER=/SHLIB_EXT= (matching org.kde.ktrip.yml/de.akaflieg_freiburg.enroute.yml's
    # OpenSSL 1.1.1 builds) is NOT honored by upstream OpenSSL 3.3.2's build system the same way —
    # it just produces plain libssl.so/libcrypto.so regardless — so the loop below finds whatever
    # actually got built and renames it to the libssl_3.so/libcrypto_3.so name CMakeLists.txt
    # expects (KDAB's own naming convention, since Android only bundles files ending in ".so").
    #
    # Unprivileged: the same three cmake passes as scripts/build-kf6-android.sh (ECM,
    # KCoreAddons, Kirigami, cross-compiled), then the app itself as scripts/build-android.sh does.
    build:
      - export NDK_PATH=$$SDK$$/ndk/28.2.13676358
      - export QT_ANDROID=/opt/plasmai-qt/6.7.3/android_arm64_v8a
      - export QT_HOST=/opt/plasmai-qt/6.7.3/gcc_64
      - export KF6=$HOME/kf6-android
      - mkdir -p $KF6
      - git clone --quiet --depth 1 --branch openssl-3.3.2
        https://github.com/openssl/openssl.git /tmp/openssl
      - cd /tmp/openssl
      - export ANDROID_NDK_ROOT=$NDK_PATH
      - PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH ./Configure shared
        android-arm64 -D__ANDROID_API__=28
      - PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH make -j$(nproc)
        SHLIB_VERSION_NUMBER= SHLIB_EXT=_3.so build_libs > /tmp/openssl-build.log 2>&1 ||
        (tail -n 200 /tmp/openssl-build.log; exit 1)
      - cd -
      - mkdir -p app/libs/openssl/arm64-v8a
      - ls -la /tmp/openssl/*.so* 2>&1 || true
      - for f in libssl libcrypto; do src=$(ls /tmp/openssl/${f}*.so* 2>/dev/null | head -1);
        if [ -n "$src" ]; then cp "$src" app/libs/openssl/arm64-v8a/${f}_3.so; fi; done
      - ls -la app/libs/openssl/arm64-v8a/
      - git clone --quiet --depth 1 --branch v6.8.0
        https://invent.kde.org/frameworks/extra-cmake-modules.git /tmp/ecm
      - cmake -S /tmp/ecm -B /tmp/ecm/build -G Ninja -DCMAKE_INSTALL_PREFIX=$KF6
        -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF
        -DBUILD_MAN_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF
      - cmake --build /tmp/ecm/build -j$(nproc)
      - cmake --install /tmp/ecm/build
      - git clone --quiet --depth 1 --branch v6.8.0
        https://invent.kde.org/frameworks/kcoreaddons.git /tmp/kcoreaddons
      - cmake -S /tmp/kcoreaddons -B /tmp/kcoreaddons/build -G Ninja
        -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PREFIX_PATH="$QT_ANDROID;$KF6" -DCMAKE_INSTALL_PREFIX=$KF6
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DQT_HOST_PATH=$QT_HOST
        -DECM_DIR=$KF6/share/ECM/cmake -DBUILD_TESTING=OFF -DBUILD_QCH=OFF
      - cmake --build /tmp/kcoreaddons/build -j$(nproc)
      - cmake --install /tmp/kcoreaddons/build
      - git clone --quiet --depth 1 --branch v6.8.0
        https://invent.kde.org/frameworks/kirigami.git /tmp/kirigami
      - cmake -S /tmp/kirigami -B /tmp/kirigami/build -G Ninja
        -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PREFIX_PATH="$QT_ANDROID;$KF6" -DCMAKE_INSTALL_PREFIX=$KF6
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DQT_HOST_PATH=$QT_HOST
        -DECM_DIR=$KF6/share/ECM/cmake -DBUILD_TESTING=OFF -DBUILD_QCH=OFF
        -DBUILD_EXAMPLES=OFF -DDESKTOP_ENABLED=OFF
      - cmake --build /tmp/kirigami/build -j$(nproc)
      - cmake --install /tmp/kirigami/build
      - cd app
      - cmake -B build-android
        -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake
        -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34
        -DCMAKE_PREFIX_PATH="$QT_ANDROID;$KF6" -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
        -DQT_HOST_PATH=$QT_HOST -DANDROID_SDK_ROOT=$$SDK$$
        -DQT_ANDROID_TARGET_SDK_VERSION=34 -DECM_DIR=$KF6/share/ECM/cmake
        -DQT_QML_IMPORT_PATH=$KF6/lib/qml -DBUILD_TESTING=OFF
      - cmake --build build-android -j$(nproc)
      - export LIBOMP=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/19/lib/linux/aarch64/libomp.so
      - mkdir -p build-android/android-build/libs/arm64-v8a
      - test -f $LIBOMP && cp $LIBOMP build-android/android-build/libs/arm64-v8a/ || true
      - cd build-android/android-build
      - ./gradlew assembleRelease

    output: app/build-android/android-build/build/outputs/apk/release/android-build-release-unsigned.apk
    scandelete:
      - app/libs/openssl/arm64-v8a/libssl_3.so
      - app/libs/openssl/arm64-v8a/libcrypto_3.so

# Auto-update from new git tags (CONTRIBUTING.md "After You Added Your App"). versionCode isn't
# derivable from the tag name alone (v2.0.0 -> 20000), so UpdateCheckData reads it from
# AndroidManifest.xml, which RELEASING.md 1's version bump keeps in sync with metadata.json.
AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/android/AndroidManifest.xml|versionCode="(\d+)"|.|versionName="([\d.]+)"
CurrentVersion: '2.0.0'
CurrentVersionCode: 20000
