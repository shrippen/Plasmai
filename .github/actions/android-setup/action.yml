name: Android build setup
description: Java, the libraries Qt's host tools need, and the Android SDK packages for scripts/build-android.sh

runs:
  using: composite
  steps:
    - name: Install Java (for Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Qt's host tools (qsb for Kirigami's shaders) need the GL libraries a desktop has.
    - name: Install host libraries for Qt tools
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 > /dev/null

    # The runner ships an Android SDK with sdkmanager; add what the build needs.
    - name: Install Android SDK packages
      shell: bash
      run: |
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0" > /dev/null
        # Qt 6.7's androiddeployqt builds against the newest platform and has no CMake
        # setting for it; the runner's android-35/36 break resource linking. Keep 34.
        find "$ANDROID_SDK_ROOT/platforms" -maxdepth 1 -name 'android-*' ! -name 'android-34' -exec rm -rf {} +
