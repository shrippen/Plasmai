name: Checks

# Guards for the shared code (ROADMAP pillar 5, step 6):
#   unit      QML unit tests in three time zones, app resources, pytest log classifier
#   app       build-only of the Kirigami app on Linux (with KF6), Windows and macOS
#             (C++ only): fails when Linux-only code creeps into the app; publishes nothing
#
# Arch Linux container: the only runner image with KF6 (Kirigami, libplasma) as packages,
# the same stack as a developer machine.

on:
  # Branches get their run through the pull request; main (and the Gitea mirror's pushes) directly.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'fastlane/**', 'metadata.json']
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # GitHub only: Gitea Actions also reads .github/workflows, the mirror builds there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install Qt, Kirigami, libplasma
        run: |
          pacman -Syu --noconfirm --needed qt6-declarative kirigami libplasma tzdata python python-pytest git
      - uses: actions/checkout@v7

      # Stamps are local days: run where Berlin assumptions break (UTC runner, UTC-8, UTC+14).
      - name: QML unit tests
        run: |
          for tz in UTC America/Los_Angeles Pacific/Kiritimati; do
            echo "::group::TZ=$tz"
            TZ=$tz QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/unit
            echo "::endgroup::"
          done

      - name: App resources
        run: python3 tests/test_app_resources.py

      # The same selection as `tests/run.sh unit` (the viewer tests need a Plasma session).
      - name: pytest (log classifier)
        run: python3 -m pytest tests/test_app_resources.py tests/viewer/test_error_classifier.py tests/viewer/test_deny_list.py -q

  app-linux:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install Qt, KF6, QtKeychain
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake ninja git extra-cmake-modules \
            qt6-declarative qt6-svg qt6-shadertools kirigami qtkeychain-qt6 gnome-keyring dbus
      - uses: actions/checkout@v7
      - name: Build the app and its C++ tests
        run: |
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLASMAI_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      # Token storage with a real Secret Service: round trip and migration of old token files.
      # Not as root: gnome-keyring-daemon then drops capabilities, which a container refuses.
      - name: Token storage with a keychain
        run: |
          useradd -m ci && chown -R ci build
          su ci -c "dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && sleep 1 && ctest --test-dir build --output-on-failure -R tokenstore -V'" | tee tokenstore.log
          grep -q "PASS   : TstTokenStore::withKeychain()" tokenstore.log

  app:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          # aqtinstall finds no Windows packages of Qt 6.11.x (download.qt.io metadata), 6.10 works;
          # enough for a build check. Move to 6.11 once aqt resolves it.
          - os: windows-latest
            qt: '6.10.3'
          - os: macos-latest
            qt: '6.11.3'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      KF_VERSION: '6.30.0'
      QTKEYCHAIN_VERSION: '0.15.0'
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qtshadertools
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: seanmiddleditch/gha-setup-ninja@v5

      # ECM (CMake modules only) and QtKeychain: required by app/CMakeLists.txt. Kirigami is
      # optional there (QUIET), so this job checks the C++ side only.
      - name: ECM and QtKeychain
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/deps"
          git clone -q --depth 1 --branch "v$KF_VERSION" https://invent.kde.org/frameworks/extra-cmake-modules.git ecm
          cmake -S ecm -B ecm/build -G Ninja -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_TESTING=OFF \
            -DBUILD_HTML_DOCS=OFF -DBUILD_MAN_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF
          cmake --install ecm/build
          git clone -q --depth 1 --branch "$QTKEYCHAIN_VERSION" https://github.com/frankosterfeld/qtkeychain.git qtkeychain
          cmake -S qtkeychain -B qtkeychain/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TEST_APPLICATION=OFF
          cmake --build qtkeychain/build
          cmake --install qtkeychain/build

      # The runner's login keychain is locked (reads wait for a prompt): an unlocked one
      # for the token storage test.
      - name: Keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain

      - name: Build the app and its C++ tests
        shell: bash
        run: |
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLASMAI_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps"
          cmake --build build
          ctest --test-dir build --output-on-failure -V | tee ctest.log
          if [ "$RUNNER_OS" != Linux ]; then grep -q "PASS   : TstTokenStore::withKeychain()" ctest.log; fi
