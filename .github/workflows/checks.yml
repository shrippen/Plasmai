name: Checks

# Guards for the shared code (ROADMAP pillar 5, step 6):
#   unit      QML unit tests in three time zones, qmllint, app resources, pytest log classifier
#   app       build-only of the Kirigami app on Linux (with KF6), Windows and macOS
#             (C++ only): fails when Linux-only code creeps into the app; publishes nothing
#
# Arch Linux container: the only runner image with KF6 (Kirigami, libplasma) as packages,
# the same stack as a developer machine.

on:
  # Branches get their run through the pull request; main (and the Gitea mirror's pushes) directly.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'fastlane/**', 'metadata.json']
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # GitHub only: Gitea Actions also reads .github/workflows, the mirror builds there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install Qt, Kirigami (+ addons for the app's pickers), libplasma, Plasma5Support (qmllint)
        run: |
          pacman -Syu --noconfirm --needed qt6-declarative kirigami kirigami-addons libplasma plasma5support tzdata python python-pytest git
      - uses: actions/checkout@v7

      # Stamps are local days: run where Berlin assumptions break (UTC runner, UTC-8, UTC+14).
      - name: QML unit tests
        run: |
          for tz in UTC America/Los_Angeles Pacific/Kiritimati; do
            echo "::group::TZ=$tz"
            TZ=$tz QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/unit
            echo "::endgroup::"
          done

      # Shared components and the Plasmoid. Off: "unqualified" (the plasmoid object, i18n and
      # the parent scope are context properties by design) and "missing-property" (properties
      # typed var / Item hide the real type). The app's pages resolve only through its qrc.
      - name: qmllint
        run: |
          /usr/lib/qt6/bin/qmllint --unqualified disable --missing-property disable --max-warnings 0 \
            -I contents/ui $(find contents/ui -name '*.qml' | sort)

      - name: App resources
        run: python3 tests/test_app_resources.py

      # The same selection as `tests/run.sh unit` (the viewer tests need a Plasma session).
      - name: pytest (log classifier)
        run: python3 -m pytest tests/test_app_resources.py tests/test_shared_defaults.py tests/viewer/test_error_classifier.py tests/viewer/test_deny_list.py -q

  app-linux:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install Qt, KF6, QtKeychain
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake ninja git extra-cmake-modules \
            qt6-declarative qt6-svg qt6-shadertools kirigami qtkeychain-qt6 gnome-keyring dbus
      - uses: actions/checkout@v7
      - name: Build the app and its C++ tests
        run: |
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLASMAI_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      # Token storage with a real Secret Service: round trip and migration of old token files.
      # Not as root: gnome-keyring-daemon then drops capabilities, which a container refuses.
      - name: Token storage with a keychain
        run: |
          useradd -m ci && chown -R ci build
          su ci -c "dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && sleep 1 && ctest --test-dir build --output-on-failure -R tokenstore -V'" | tee tokenstore.log
          grep -q "PASS   : TstTokenStore::withKeychain()" tokenstore.log

  app:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          # aqtinstall finds no Windows packages of Qt 6.11.x (download.qt.io metadata), 6.10 works;
          # enough for a build check. Move to 6.11 once aqt resolves it.
          - os: windows-latest
            qt: '6.10.3'
          - os: macos-latest
            qt: '6.11.3'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      KF_VERSION: '6.30.0'
      QTKEYCHAIN_VERSION: '0.15.0'
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qtshadertools
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: seanmiddleditch/gha-setup-ninja@v5

      # ECM and QtKeychain: required by app/CMakeLists.txt. Kirigami (Windows only): the
      # tray client is the Windows build, so it is built whole and run (see below); macOS
      # checks the C++ side only. Cached: they change only with their versions.
      - name: Cache dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ matrix.os }}-qt${{ matrix.qt }}-kf${{ env.KF_VERSION }}-qtkeychain${{ env.QTKEYCHAIN_VERSION }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: ECM, QtKeychain, Kirigami
        if: steps.deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          kirigami=""
          [ "$RUNNER_OS" = "Windows" ] && kirigami="--kirigami"
          ./scripts/build-deps.sh "$GITHUB_WORKSPACE/deps" $kirigami

      # A keychain of its own, unlocked, so the token storage test does not depend on the
      # runner's login keychain.
      - name: Keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain

      - name: Build the app and its C++ tests
        shell: bash
        run: |
          # Windows: with the scripted test driver and the demo, for the run below.
          extra=""
          [ "$RUNNER_OS" = "Windows" ] && extra="-DPLASMAI_TEST_DRIVER=ON"
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLASMAI_BUILD_TESTS=ON $extra \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps"
          cmake --build build
          # Windows passes no test output to ctest: show the logs when a test fails.
          ctest --test-dir build --output-on-failure || { cat build/*.log; exit 1; }
          grep -q "PASS   : TstTokenStore::withKeychain()" build/tokenstore.log

      # The Windows app on the demo (offscreen: no tray there, so the window itself): its pages
      # load with Kirigami, and the screenshots show them. The tray itself needs a desktop.
      - name: Run the app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/deps/bin:$PATH"
          export QML_IMPORT_PATH="$(cygpath -m "$GITHUB_WORKSPACE/deps/lib/qml")"
          export QT_QPA_PLATFORM=offscreen PLASMAI_TEST_SCRIPT=tests/app/demo-screens.txt PLASMAI_TEST_OUT=screens
          mkdir -p screens
          timeout 120 build/plasmai-app.exe > screens/app.log 2>&1 || { cat screens/app.log; exit 1; }
          cat screens/app.log
          for n in 1-timer 2-filmday 3-stats 4-trips 5-settings; do
            test -s "screens/$n.png" || { echo "::error::no screenshot $n"; exit 1; }
          done
          if grep -E "TypeError|ReferenceError|is not defined|failed to load|module .* is not installed" screens/app.log; then
            echo "::error::QML errors in the Windows run"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows'
        with:
          name: windows-screens
          path: screens
          if-no-files-found: ignore
