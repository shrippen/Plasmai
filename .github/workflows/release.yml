name: Release

# A tag v* reaches GitHub through the Gitea push mirror; the release itself is created on
# Gitea (tea, without APK). Here the signed APK is built and the GitHub release made with
# the same notes (scripts/release-notes.sh), so IzzyOnDroid can fetch the APK.
# Run by hand (workflow_dispatch) it only builds an unsigned release APK as a test.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/android-setup

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Keystore
        if: steps.version.outputs.tag != ''
        env:
          PLASMAI_KEYSTORE_B64: ${{ secrets.PLASMAI_KEYSTORE_B64 }}
        run: |
          [ -n "$PLASMAI_KEYSTORE_B64" ] || { echo "::error::Secret PLASMAI_KEYSTORE_B64 is missing (RELEASING.md 4.3)"; exit 1; }
          echo "$PLASMAI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/plasmai-release.jks"
          echo "PLASMAI_KEYSTORE_PATH=$RUNNER_TEMP/plasmai-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          PLASMAI_VERBOSE: 1
          PLASMAI_KEYSTORE_PASSWORD: ${{ secrets.PLASMAI_KEYSTORE_PASSWORD }}
          PLASMAI_KEY_ALIAS: ${{ secrets.PLASMAI_KEY_ALIAS }}
          PLASMAI_KEY_PASSWORD: ${{ secrets.PLASMAI_KEY_PASSWORD }}
        run: |
          ./scripts/build-android.sh release
          mv dist/android/plasmai-app-release.apk "dist/android/Plasmai-${{ steps.version.outputs.version }}.apk"

      - name: Check signature
        if: steps.version.outputs.tag != ''
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs \
            "dist/android/Plasmai-${{ steps.version.outputs.version }}.apk"

      - name: GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section '## $VERSION'"; exit 1; }
          APK="dist/android/Plasmai-$VERSION.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Plasmai $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasmai-${{ steps.version.outputs.version }}
          path: dist/android/Plasmai-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
