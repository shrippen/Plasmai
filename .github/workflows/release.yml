name: Release

# A tag v* reaches GitHub through the Gitea push mirror; the release itself is also made on
# Gitea (tea). Here the GitHub release is created with the same notes
# (scripts/release-notes.sh) and every platform's asset is built and attached (RELEASING.md 6):
# the signed APK (IzzyOnDroid fetches it here), the AppImage, the Flatpak bundle and the widget.
#
# Run by hand (workflow_dispatch):
#   - without `tag`: builds everything as a test, no release (the APK is signed and checked
#     when the keystore secrets are set);
#   - with `tag` (e.g. v2.0.0): builds that tag and attaches the files to its existing release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the assets to (empty: test build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG=""
          [ "$GITHUB_REF_TYPE" = "tag" ] && TAG="$GITHUB_REF_NAME"
          [ -n "$INPUT_TAG" ] && TAG="$INPUT_TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=test" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag || github.ref }}

      - name: GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section '## $VERSION'"; exit 1; }
          gh release create "$TAG" --title "Plasmai $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  apk:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      # An older tag lacks newer release tooling: take it from this workflow's commit
      # (a no-op when the tag is that commit).
      - name: Release tooling of this workflow
        run: |
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- .github scripts/build-appimage.sh

      - uses: ./.github/actions/android-setup

      # A release needs the key; a test run signs only when the secrets are set.
      - name: Keystore
        id: keystore
        env:
          PLASMAI_KEYSTORE_B64: ${{ secrets.PLASMAI_KEYSTORE_B64 }}
          IS_RELEASE: ${{ needs.release.outputs.tag != '' }}
        run: |
          if [ -z "$PLASMAI_KEYSTORE_B64" ]; then
            [ "$IS_RELEASE" != "true" ] || { echo "::error::Secret PLASMAI_KEYSTORE_B64 is missing (RELEASING.md 4.3)"; exit 1; }
            echo "No keystore secret: unsigned test build."
            exit 0
          fi
          echo "$PLASMAI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/plasmai-release.jks"
          echo "PLASMAI_KEYSTORE_PATH=$RUNNER_TEMP/plasmai-release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          PLASMAI_VERBOSE: 1
          PLASMAI_KEYSTORE_PASSWORD: ${{ secrets.PLASMAI_KEYSTORE_PASSWORD }}
          PLASMAI_KEY_ALIAS: ${{ secrets.PLASMAI_KEY_ALIAS }}
          PLASMAI_KEY_PASSWORD: ${{ secrets.PLASMAI_KEY_PASSWORD }}
        run: |
          mkdir -p assets
          if [ -x scripts/build-apk-reproducible.sh ]; then
            # The same build as F-Droid's (Reproducible Builds): see the script's header.
            sudo apt-get install -y -q ninja-build > /dev/null
            pip install --user --break-system-packages -q aqtinstall==3.3.0
            sudo install -d -o "$USER" /opt/plasmai-qt
            ~/.local/bin/aqt install-qt all_os android 6.11.3 android_arm64_v8a -m qtshadertools -O /opt/plasmai-qt > /dev/null
            ~/.local/bin/aqt install-qt linux desktop 6.11.3 linux_gcc_64 -m qtshadertools -O /opt/plasmai-qt > /dev/null
            ./scripts/build-apk-reproducible.sh
            APK=$(ls app/build-android/android-build/build/outputs/apk/release/*.apk)
          else
            # Tags from before v2.0.1.
            ./scripts/build-android.sh release
            APK=dist/android/plasmai-app-release.apk
          fi
          mv "$APK" "assets/Plasmai-${{ needs.release.outputs.version }}.apk"

      - name: Check signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs assets/*.apk

      - uses: ./.github/actions/release-asset
        with:
          tag: ${{ needs.release.outputs.tag }}
          name: apk

  appimage:
    needs: release
    # The oldest supported runner: the AppImage runs where its glibc is at least this old.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      # An older tag lacks newer release tooling: take it from this workflow's commit
      # (a no-op when the tag is that commit).
      - name: Release tooling of this workflow
        run: |
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- .github scripts/build-appimage.sh

      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build gettext libsecret-1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libdbus-1-3 file > /dev/null

      - name: Build AppImage
        env:
          PLASMAI_VERBOSE: 1
        run: |
          ./scripts/build-appimage.sh
          mkdir -p assets && mv dist/appimage/*.AppImage assets/

      - uses: ./.github/actions/release-asset
        with:
          tag: ${{ needs.release.outputs.tag }}
          name: appimage

  flatpak:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      # An older tag lacks newer release tooling: take it from this workflow's commit
      # (a no-op when the tag is that commit).
      - name: Release tooling of this workflow
        run: |
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- .github scripts/build-appimage.sh

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder > /dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # The same manifest as for local builds; runtime and SDK come from Flathub.
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/build" packaging/flatpak/io.github.shrippen.Plasmai.yml
          mkdir -p assets
          flatpak build-bundle "$RUNNER_TEMP/repo" "assets/Plasmai-${{ needs.release.outputs.version }}-x86_64.flatpak" \
            io.github.shrippen.Plasmai --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: ./.github/actions/release-asset
        with:
          tag: ${{ needs.release.outputs.tag }}
          name: flatpak

  plasmoid:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      # An older tag lacks newer release tooling: take it from this workflow's commit
      # (a no-op when the tag is that commit).
      - name: Release tooling of this workflow
        run: |
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- .github scripts/build-appimage.sh

      - name: Build widget package
        run: |
          sudo apt-get install -y -q gettext zip > /dev/null
          ./scripts/package.sh
          mkdir -p assets && mv dist/plasmoid/*.plasmoid assets/

      - uses: ./.github/actions/release-asset
        with:
          tag: ${{ needs.release.outputs.tag }}
          name: plasmoid
