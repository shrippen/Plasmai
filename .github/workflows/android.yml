name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'contents/code/**'
      - 'contents/ui/**'
      - 'translate/**'
      - 'scripts/build-android.sh'
      - 'scripts/build-kf6-android.sh'
      - '.github/actions/android-setup/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    # GitHub only: Gitea Actions also reads .github/workflows, the mirror builds there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/android-setup

      # The same script as on a developer machine: Qt via aqtinstall, KF6 (Kirigami)
      # from source, CMake, libomp for Kirigami, Gradle.
      - name: Build APK
        env:
          PLASMAI_VERBOSE: 1
        run: ./scripts/build-android.sh debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasmai-app-debug
          path: dist/android/plasmai-app-debug.apk
          if-no-files-found: error
          retention-days: 7
