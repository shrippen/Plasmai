name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'contents/code/**'
      - 'contents/ui/**'
      - 'translate/**'
      - 'scripts/build-android.sh'
      - 'scripts/build-kf6-android.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    # GitHub only: Gitea Actions also reads .github/workflows, the mirror builds there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Qt's host tools (qsb for Kirigami's shaders) need the GL libraries a desktop has.
      - name: Install host libraries for Qt tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 > /dev/null

      # The runner ships an Android SDK with sdkmanager; add what the build needs.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # The same script as on a developer machine: Qt via aqtinstall, KF6 (Kirigami)
      # from source, CMake, libomp for Kirigami, Gradle.
      - name: Build APK
        run: ./scripts/build-android.sh debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasmai-app-debug
          path: dist/android/plasmai-app-debug.apk
          if-no-files-found: error
          retention-days: 7
